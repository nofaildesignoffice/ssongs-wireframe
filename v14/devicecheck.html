<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기기 폰트 검사</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;padding:20px 16px 60px;background:#fff;color:#1A1A1A;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
    font-synthesis-weight:none;font-synthesis:none}
  h1{font-size:22px;font-weight:800;letter-spacing:-.022em;margin:0 0 4px}
  .sub{color:#666;font-size:13px;margin:0 0 22px}
  .verdict{border-radius:12px;padding:18px 16px;margin:0 0 22px;font-weight:700;font-size:17px;line-height:1.45}
  .ok{background:#E8F5E9;color:#1B5E20}
  .bad{background:#FFEBEE;color:#B71C1C}
  .verdict small{display:block;font-weight:500;font-size:13px;margin-top:7px;opacity:.85}
  table{width:100%;border-collapse:collapse;margin:0 0 26px;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #E0E0E0;vertical-align:top}
  th{color:#666;font-weight:500;width:42%;white-space:nowrap}
  td{font-weight:600;word-break:break-all}
  td.y{color:#1B5E20}
  td.n{color:#B71C1C}
  h2{font-size:15px;font-weight:800;margin:28px 0 10px;letter-spacing:-.02em}
  .note{font-size:13px;color:#666;margin:0 0 12px;line-height:1.55}
  .samp{border:1px solid #E0E0E0;border-radius:10px;padding:14px;margin:0 0 10px}
  .samp .lab{font-size:11.5px;font-weight:600;color:#666;margin:0 0 8px;letter-spacing:.02em}
  .samp .txt{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.25;white-space:nowrap;overflow:hidden}
  .samp .w{font-size:12px;color:#666;font-weight:500;margin-top:8px}
  .fb .txt{font-family:sans-serif}
  button{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:#1A1A1A;color:#fff;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
  #raw{width:100%;height:150px;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;border:1px solid #E0E0E0;border-radius:8px;padding:10px;display:none}
</style>
</head>
<body>

<h1>기기 폰트 검사</h1>
<p class="sub">쏭스 와이어프레임 — 갤럭시 / 아이폰 비교용</p>

<div id="verdict" class="verdict">검사 중…</div>

<table id="tbl"></table>

<h2>같은 글자, 두 폰트 비교</h2>
<p class="note">위아래 글자 모양과 <b>가로 길이</b>가 다르면 Pretendard가 제대로 적용된 겁니다.
같으면 Pretendard가 안 깔려서 기본 폰트로 나오고 있는 겁니다.</p>

<div class="samp" id="s1">
  <p class="lab">① 사이트 설정 (Pretendard여야 정상)</p>
  <div class="txt">카드 3장 수납과</div>
  <p class="w"></p>
</div>

<div class="samp fb" id="s2">
  <p class="lab">② 기기 기본 폰트 (비교용)</p>
  <div class="txt">카드 3장 수납과</div>
  <p class="w"></p>
</div>

<button id="copy">결과 전체 복사하기</button>
<textarea id="raw" readonly></textarea>

<script>
(function(){
  function px(el){ return Math.round(el.getBoundingClientRect().width * 10) / 10; }

  var s1 = document.querySelector('#s1 .txt');
  var s2 = document.querySelector('#s2 .txt');

  function run(){
    var w1 = px(s1), w2 = px(s2);
    var diff = Math.round(Math.abs(w1 - w2) * 10) / 10;
    document.querySelector('#s1 .w').textContent = '가로 ' + w1 + 'px';
    document.querySelector('#s2 .w').textContent = '가로 ' + w2 + 'px';

    var loaded = false;
    try { loaded = document.fonts.check('800 28px "Pretendard Variable"'); } catch(e){}
    var applied = loaded && diff > 1;

    // 글자 자동확대(폰트 부스팅) 검사 — 16px 로 지정한 긴 문단의 실제 크기를 잰다
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:320px;font-size:16px;line-height:1.6';
    probe.textContent = '이 문장은 글자 크기가 설정대로 나오는지 재기 위한 것입니다. '.repeat(6);
    document.body.appendChild(probe);
    var real = parseFloat(getComputedStyle(probe).fontSize);
    probe.remove();
    var boosted = Math.abs(real - 16) > 0.6;

    var adj = getComputedStyle(document.documentElement).webkitTextSizeAdjust || '(지원안함)';
    var syn = getComputedStyle(document.body).fontSynthesisWeight
           || getComputedStyle(document.body).fontSynthesis || '(지원안함)';
    var h2cs = getComputedStyle(s1);

    var ua = navigator.userAgent;
    var br = /SamsungBrowser\/([\d.]+)/.test(ua) ? '삼성인터넷 ' + RegExp.$1
           : /CriOS\/([\d.]+)/.test(ua)          ? '아이폰 크롬 ' + RegExp.$1
           : /EdgA?\/([\d.]+)/.test(ua)          ? '엣지 ' + RegExp.$1
           : /Chrome\/([\d.]+)/.test(ua)         ? '크롬 ' + RegExp.$1
           : /Version\/([\d.]+).*Safari/.test(ua)? '사파리 ' + RegExp.$1
           : '기타';
    var os  = /Android ([\d.]+)/.test(ua)  ? '안드로이드 ' + RegExp.$1
            : /OS (\d+[_\d]*) like Mac/.test(ua) ? 'iOS ' + RegExp.$1.replace(/_/g, '.')
            : /Windows NT ([\d.]+)/.test(ua) ? '윈도우 ' + RegExp.$1
            : '기타';

    var rows = [
      ['기기 / OS',        os,        null],
      ['브라우저',         br,        null],
      ['화면 가로',        window.innerWidth + 'px (실화소 ' + Math.round(window.innerWidth * devicePixelRatio) + ')', null],
      ['Pretendard 내려받음', loaded ? '예' : '아니오 — 이게 원인', loaded],
      ['Pretendard 실제 적용', applied ? '예' : '아니오 — 이게 원인', applied],
      ['두 폰트 가로 차이', diff + 'px' + (diff > 1 ? '' : ' — 사실상 같음'), diff > 1],
      ['글자 자동확대',    boosted ? '일어남 (' + real + 'px) — 이게 원인' : '없음 (16px 그대로)', !boosted],
      ['자동확대 차단값',  adj,       adj === '100%'],
      ['가짜 굵게 차단',   syn,       /none/.test(syn)],
      ['제목 실제 폰트',   h2cs.fontFamily.split(',')[0].replace(/"/g, ''), null],
      ['제목 크기 / 굵기', h2cs.fontSize + ' / ' + h2cs.fontWeight, null],
      ['제목 자간',        h2cs.letterSpacing, null]
    ];

    var t = document.getElementById('tbl');
    t.innerHTML = rows.map(function(r){
      var cls = r[2] === null ? '' : (r[2] ? ' class="y"' : ' class="n"');
      return '<tr><th>' + r[0] + '</th><td' + cls + '>' + r[1] + '</td></tr>';
    }).join('');

    var v = document.getElementById('verdict');
    if (applied && !boosted) {
      v.className = 'verdict ok';
      v.innerHTML = '정상입니다<small>Pretendard가 제대로 적용됐고 글자 자동확대도 없습니다. ' +
        '이 기기는 아이폰과 같게 나와야 합니다.</small>';
    } else {
      var why = [];
      if (!loaded)  why.push('Pretendard 폰트를 못 내려받았습니다');
      else if (!applied) why.push('Pretendard를 내려받았는데 글자에 안 먹고 있습니다');
      if (boosted)  why.push('브라우저가 글자를 ' + real + 'px로 키우고 있습니다');
      v.className = 'verdict bad';
      v.innerHTML = '원인 찾았습니다<small>' + why.join('<br>') +
        '<br><br>아래 「결과 전체 복사하기」를 눌러서 보내주세요.</small>';
    }

    document.getElementById('raw').value =
      rows.map(function(r){ return r[0] + ': ' + r[1]; }).join('\n') + '\nUA: ' + ua;
  }

  // 폰트가 다 받아진 뒤에 재야 정확하다
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function(){ setTimeout(run, 150); });
    setTimeout(run, 3000);
  } else {
    window.addEventListener('load', function(){ setTimeout(run, 500); });
  }

  document.getElementById('copy').addEventListener('click', function(){
    var ta = document.getElementById('raw');
    ta.style.display = 'block';
    ta.select(); ta.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); this.textContent = '복사했습니다 — 붙여넣어 보내주세요'; }
    catch(e){ this.textContent = '아래 글상자를 길게 눌러 복사해 주세요'; }
  });
})();
</script>
</body>
</html>
