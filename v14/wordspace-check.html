<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>띄어쓰기 간격 기종 검사 — 쏭스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
 href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#fff; --ink:#1a1a1a; --dim:#555; --lt:#8a8a8a;
  --line:#e5e5e5; --box:#fafafa; --ok:#0a7a3d; --no:#b4231f; --hl:#fff6d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#ededed; --dim:#b0b0b0; --lt:#888;
    --line:#2e2e2e; --box:#1c1c1c; --ok:#4fc27e; --no:#ff6b63; --hl:#3a3320;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#ededed; --dim:#b0b0b0; --lt:#888;
  --line:#2e2e2e; --box:#1c1c1c; --ok:#4fc27e; --no:#ff6b63; --hl:#3a3320;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
    system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size:15px; line-height:1.6;
}
.wrap{max-width:720px; margin:0 auto; padding:22px 16px 56px}
h1{font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0 0 6px; line-height:1.3}
.lead{font-size:13px; color:var(--dim); margin:0 0 22px}
h2{font-size:14px; font-weight:700; letter-spacing:-.01em; margin:30px 0 10px;
  padding-bottom:7px; border-bottom:1px solid var(--line)}
.card{border:1px solid var(--line); border-radius:10px; padding:14px;
  margin:0 0 10px; background:var(--box)}
.card.on{background:var(--hl); border-color:#d8c47a}
.tag{display:flex; justify-content:space-between; align-items:baseline;
  gap:10px; margin:0 0 8px; flex-wrap:wrap}
.tag b{font-size:12px; font-weight:700; color:var(--dim); letter-spacing:.02em}
.tag i{font-style:normal; font-size:12px; color:var(--lt);
  font-variant-numeric:tabular-nums}
.samp{font-size:14px; font-weight:400; color:var(--ink); line-height:1.55; margin:0}
.rec{display:inline-block; font-size:10.5px; font-weight:700; color:#6b5200;
  background:#ffd84d; border-radius:999px; padding:2px 8px; letter-spacing:.02em}
table{width:100%; border-collapse:collapse; font-size:12.5px}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);
  vertical-align:top}
th{font-weight:700; color:var(--dim); width:44%}
td{font-variant-numeric:tabular-nums; word-break:break-all}
.y{color:var(--ok); font-weight:700}
.n{color:var(--no); font-weight:700}
.note{font-size:12px; color:var(--lt); margin:10px 0 0; line-height:1.55}
.copy{-webkit-appearance:none; appearance:none; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:inherit; font-size:13px;
  font-weight:600; border-radius:8px; padding:11px 16px; margin-top:14px;
  cursor:pointer; width:100%}
.copy:active{opacity:.6}
#out{margin-top:10px; font-size:11.5px; color:var(--lt); white-space:pre-wrap;
  word-break:break-all; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">

<h1>띄어쓰기 간격 기종 검사</h1>
<p class="lead">
  이 기종·브라우저에서 후보값이 실제로 다르게 보이는지 확인하는 페이지입니다.
  아래 네 줄은 <b>같은 문장</b>이고 <code>word-spacing</code> 값만 다릅니다.
  눈으로 차이가 보이는지 보시고, 아래 표의 실측 px도 같이 봐주세요.
</p>

<h2>1. 눈으로 비교 — 같은 문장, 공백만 다름</h2>
<div id="samples"></div>
<p class="note">
  줄이 바뀌는 자리는 기종마다 다를 수 있습니다. 보실 건 <b>어절 사이가 좁아졌는지</b>입니다.
</p>

<h2>2. 이 기종의 실측값</h2>
<table id="meas"><tbody></tbody></table>

<h2>3. 이 기종 정보</h2>
<table id="env"><tbody></tbody></table>

<button class="copy" id="btn" type="button">측정 결과 전체 복사</button>
<div id="out"></div>

</div>

<script>
(function(){
  var SENT = '4월 중순 출고 · 선 예약판매 특가 할인 중 · Galaxy S26 Series 판매 중';
  var CANDS = [
    {ws:'normal',   label:'패치 전 (normal)', rec:false},
    {ws:'-.0133em', label:'현재 배포됨 (-.0133em)', rec:false},
    {ws:'-.05em',   label:'후보 A (-.05em)', rec:false},
    {ws:'-.07em',   label:'후보 B (-.07em)', rec:true}
  ];

  // ── 1. 눈으로 비교 ───────────────────────────────────────────────
  var host = document.getElementById('samples');
  CANDS.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'card' + (c.rec ? ' on' : '');
    var t = document.createElement('div');
    t.className = 'tag';
    var b = document.createElement('b'); b.textContent = c.label;
    t.appendChild(b);
    if (c.rec){ var r=document.createElement('span'); r.className='rec';
      r.textContent='추천'; t.appendChild(r); }
    var i = document.createElement('i'); i.id = 'g-' + c.ws; t.appendChild(i);
    var p = document.createElement('p');
    p.className = 'samp'; p.style.wordSpacing = c.ws; p.textContent = SENT;
    p.id = 'p-' + c.ws;
    d.appendChild(t); d.appendChild(p); host.appendChild(d);
  });

  // ── 측정 유틸 ────────────────────────────────────────────────────
  function spaceWidth(el){
    var tn = el.firstChild;
    if (!tn || tn.nodeType !== 3) return null;
    var t = tn.nodeValue, idx = t.indexOf(' ');
    if (idx < 0) return null;
    try {
      var r = document.createRange();
      // 줄 끝에서 폭 0 이 되는 공백을 피해 가장 큰 값을 쓴다
      var best = 0, n = 0;
      for (var j = 0; j < t.length && n < 6; j++){
        if (t.charCodeAt(j) !== 32) continue;
        if (!/[가-힣]/.test(t[j-1]||'') || !/[가-힣]/.test(t[j+1]||'')) continue;
        r.setStart(tn, j); r.setEnd(tn, j+1);
        var w = r.getBoundingClientRect().width;
        if (w > best) best = w;
        n++;
      }
      return best > 0 ? best : null;
    } catch(e){ return null; }
  }
  function charWidth(el, ch){
    var tn = el.firstChild;
    var t = tn.nodeValue, k = t.indexOf(ch);
    if (k < 0) return null;
    try { var r = document.createRange(); r.setStart(tn,k); r.setEnd(tn,k+1);
      return r.getBoundingClientRect().width; } catch(e){ return null; }
  }
  function fx(v, n){ return (v === null || v === undefined || isNaN(v))
    ? '측정 불가' : (Math.round(v * Math.pow(10,n)) / Math.pow(10,n)).toFixed(n); }

  var measRows = [], envRows = [], base = null;

  function measure(){
    var tb = document.querySelector('#meas tbody');
    tb.innerHTML = ''; measRows = [];
    CANDS.forEach(function(c){
      var p = document.getElementById('p-' + c.ws);
      var sw = spaceWidth(p);
      var cw = charWidth(p, '월');
      if (c.ws === 'normal') base = sw;
      var ratio = (sw !== null && cw) ? (sw / cw) : null;
      var delta = (sw !== null && base !== null) ? (sw - base) : null;
      var pct = (delta !== null && base) ? (delta / base * 100) : null;
      var lbl = document.getElementById('g-' + c.ws);
      if (lbl) lbl.textContent = (sw===null ? '' : fx(sw,2) + 'px');
      var val = fx(sw,3) + 'px'
        + (ratio !== null ? '  (글자폭의 ' + fx(ratio,3) + ')' : '')
        + (delta !== null && c.ws !== 'normal'
            ? '\n패치 전보다 ' + fx(delta,3) + 'px (' + fx(pct,1) + '%)' : '');
      measRows.push([c.label, val]);
      var tr = document.createElement('tr');
      var th = document.createElement('th'); th.textContent = c.label;
      var td = document.createElement('td'); td.textContent = val;
      tr.appendChild(th); tr.appendChild(td); tb.appendChild(tr);
    });
    // 보이는지 판정
    var b = CANDS[3], pB = document.getElementById('p-' + b.ws);
    var swB = spaceWidth(pB);
    var visible = (base !== null && swB !== null) ? (base - swB) : null;
    var verdict = (visible === null) ? '측정 불가'
      : (visible >= 0.5 ? '보임 (' + fx(visible,2) + 'px 차이)'
                        : '거의 안 보임 (' + fx(visible,2) + 'px 차이)');
    var tr = document.createElement('tr');
    var th = document.createElement('th'); th.textContent = '추천값이 눈에 보이는가';
    var td = document.createElement('td');
    td.className = (visible !== null && visible >= 0.5) ? 'y' : 'n';
    td.textContent = verdict;
    tr.appendChild(th); tr.appendChild(td); tb.appendChild(tr);
    measRows.push(['추천값이 눈에 보이는가', verdict]);
  }

  function env(){
    var tb = document.querySelector('#env tbody');
    tb.innerHTML = ''; envRows = [];
    function row(k, v, cls){
      envRows.push([k, String(v)]);
      var tr = document.createElement('tr');
      var th = document.createElement('th'); th.textContent = k;
      var td = document.createElement('td'); td.textContent = v;
      if (cls) td.className = cls;
      tr.appendChild(th); tr.appendChild(td); tb.appendChild(tr);
    }
    var pre = (function(){
      try { return document.fonts && document.fonts.check('400 16px "Pretendard Variable"', '가나다'); }
      catch(e){ return null; }
    })();
    var vf = (function(){
      try { return CSS.supports('font-variation-settings', '"wght" 400'); }
      catch(e){ return null; }
    })();
    var ws = (function(){
      try { return CSS.supports('word-spacing', '-.07em'); } catch(e){ return null; }
    })();
    function yn(v){ return v === null ? '확인 불가' : (v ? '예' : '아니오'); }
    row('화면 폭', window.innerWidth + ' x ' + window.innerHeight + ' px');
    row('픽셀 비율 (DPR)', window.devicePixelRatio || '확인 불가');
    row('Pretendard 적용됨', yn(pre), pre ? 'y' : 'n');
    row('가변폰트 지원', yn(vf), vf ? 'y' : 'n');
    row('word-spacing em 지원', yn(ws), ws ? 'y' : 'n');
    row('폰트 로딩 상태', (document.fonts && document.fonts.status) || '확인 불가');
    row('브라우저 (UA)', navigator.userAgent);
  }

  function run(){ measure(); env(); }

  if (document.fonts && document.fonts.ready && document.fonts.ready.then){
    document.fonts.ready.then(run);
    setTimeout(run, 2500);
  } else {
    setTimeout(run, 600);
  }
  window.addEventListener('resize', function(){ setTimeout(run, 120); });

  document.getElementById('btn').addEventListener('click', function(){
    var lines = ['[띄어쓰기 간격 기종 검사]', ''];
    lines.push('-- 실측 --');
    measRows.forEach(function(r){ lines.push(r[0] + ': ' + r[1].replace(/\n/g, ' / ')); });
    lines.push('', '-- 기종 --');
    envRows.forEach(function(r){ lines.push(r[0] + ': ' + r[1]); });
    var txt = lines.join('\n');
    var out = document.getElementById('out');
    function done(ok){ out.textContent = (ok ? '복사됐습니다. 그대로 붙여넣어 주세요.\n\n' : '복사가 안 되면 아래 글자를 직접 선택해 복사해 주세요.\n\n') + txt; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
    } else { done(false); }
  });
})();
</script>
</body>
</html>
